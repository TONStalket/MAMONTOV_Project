{% extends "base.html" %}
{% block title %}Регистрация — Mamontov.com{% endblock %}

{% block content %}
<section class="form-section">
    <h1>Создайте аккаунт</h1>
    <p class="form-subtitle">Войдите в сообщество Mamontov с адресом Gmail и получите доступ к мессенджеру.</p>
    <form class="form-card" method="post">
        <label for="email">Email Gmail</label>
        <input type="email" id="email" name="email" value="{{ email|default('') }}" placeholder="you@gmail.com" required>

        <label for="display_name">Отображаемое имя</label>
        <input type="text" id="display_name" name="display_name" value="{{ display_name|default('') }}" required>

        <label for="password">Пароль</label>
        <input type="password" id="password" name="password" minlength="8" required>

        <label for="confirm_password">Повторите пароль</label>
        <input type="password" id="confirm_password" name="confirm_password" minlength="8" required>

        <button class="button" type="submit">Зарегистрироваться</button>
        <p class="form-footer">Уже есть аккаунт? <a href="{{ url_for('main.login') }}">Войти</a></p>
    </form>
</section>
{% endblock %}
