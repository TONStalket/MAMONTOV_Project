{% extends "base.html" %}
{% block title %}Войти — Mamontov.com{% endblock %}

{% block content %}
<section class="form-section">
    <h1>Вход в аккаунт</h1>
    <p class="form-subtitle">Введите данные своей учётной записи, чтобы перейти к общению.</p>
    <form class="form-card" method="post">
        <label for="email">Email Gmail</label>
        <input type="email" id="email" name="email" value="{{ email|default('') }}" required>

        <label for="password">Пароль</label>
        <input type="password" id="password" name="password" required>

        <button class="button" type="submit">Войти</button>
        <p class="form-footer">Нет аккаунта? <a href="{{ url_for('main.register') }}">Создать</a></p>
    </form>
</section>
{% endblock %}
